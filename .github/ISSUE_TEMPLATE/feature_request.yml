name: Feature Request
description: Suggest a new feature for Sproutdoro
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Have an idea? We'd love to hear it!
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem does this solve, or what would it improve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work?
    validations:
      required: true
