<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#516233" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sproutdoro" />
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
    <title>Sproutdoro - Focus Timer</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body class="bg-background min-h-screen overflow-x-hidden">
    <div id="app-content" class="invisible">
    <!-- Decorative background elements -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
      <div
        class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-primary/5 blur-[100px]"
      ></div>
      <div
        class="absolute top-[20%] right-[-15%] w-[40vw] h-[40vw] rounded-full bg-secondary/5 blur-[100px]"
      ></div>
      <div
        class="absolute bottom-[-10%] left-[20%] w-[60vw] h-[60vw] rounded-full bg-tertiary/5 blur-[100px]"
      ></div>
    </div>

    <div class="relative z-10 flex min-h-screen">
      <!-- SideNav container (injected by JS) -->
      <div id="side-nav"></div>

      <!-- Main content -->
      <main
        class="flex-1 flex flex-col items-center max-w-xl mx-auto px-4 py-4 md:py-8 pb-36 md:pb-8 min-h-screen w-full"
      >
        <!-- Top header row: Session Dots -->
        <header class="w-full flex items-center justify-center py-2 mb-4">
          <!-- 5 session dots -->
          <div id="session-dots-container"></div>
        </header>

        <!-- What's your focus section -->
        <section class="w-full flex flex-col items-center gap-3 text-center mb-6">
          <h1 class="font-headline text-2xl md:text-3xl font-bold text-on-surface">
            What's your focus?
          </h1>

          <!-- Category pill dropdown -->
          <div id="category-selector" class="w-full flex justify-center">
            <div id="category-pill-row" class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1 max-w-full"></div>
          </div>

          <!-- Session Intention input -->
          <div class="w-full max-w-sm mt-1">
            <input
              id="intention-input"
              type="text"
              placeholder="Intention (optional)"
              class="w-full px-4 py-2.5 rounded-2xl bg-surface-container-high/80 dark:bg-surface-container-high text-on-surface dark:text-on-surface border border-outline-variant/40 placeholder:text-on-surface/50 font-body text-sm text-center focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all"
            />
          </div>
        </section>

        <!-- No active plant banner -->
        <div id="no-plant-banner" class="hidden mb-4 p-3.5 rounded-2xl bg-primary/10 border border-primary/20 text-center w-full max-w-sm">
          <p class="font-body text-xs text-on-surface/80">
            Visit <a href="./garden.html" class="text-primary font-semibold hover:underline">Garden</a> to plant your first seed
          </p>
        </div>

        <!-- Center Stage: Clock Dial & Timer -->
        <section class="w-full flex-1 flex flex-col items-center justify-center gap-4 my-2">
          <!-- Circular Clock Dial Container -->
          <div class="relative flex flex-col items-center justify-center">
            <div class="relative w-[280px] h-[280px] sm:w-[320px] sm:h-[320px] md:w-[360px] md:h-[360px] flex items-center justify-center">
              <!-- SVG Clock Dial -->
              <div id="clock-dial-container" class="absolute inset-0 flex items-center justify-center"></div>
              <!-- Center Plant Growth Rings -->
              <div
                id="plant-growth-center"
                class="absolute inset-0 flex items-center justify-center pointer-events-none"
              ></div>
            </div>

            <!-- Digital countdown underneath dial -->
            <div id="timer-display" class="flex flex-col items-center mt-2">
              <div class="flex items-center text-4xl md:text-5xl font-headline font-bold text-on-surface tracking-tight">
                <span id="time-mins">25</span>
                <span class="text-primary/70 mx-0.5">:</span>
                <span id="time-secs">00</span>
              </div>

              <!-- Expected time range pill: 13:15 -> 13:40 -->
              <div
                id="time-range-pill"
                class="mt-2 px-3 py-1 rounded-full bg-surface-container-high/70 border border-outline-variant/30 text-on-surface/60 font-label text-xs font-medium"
              >
                --:-- → --:--
              </div>
            </div>
          </div>

          <!-- Adjust buttons container (+3m / -3m) -->
          <div id="timer-adjust-container" class="flex items-center justify-center mt-2 transition-all duration-300 min-h-[40px]"></div>
        </section>

        <!-- Primary CTA Action Button & Controls -->
        <section class="w-full max-w-sm flex flex-col items-center gap-3 mt-4 mb-2">
          <!-- Main Action Pill Button -->
          <button
            id="btn-primary-action"
            class="w-full py-4 px-8 rounded-full bg-secondary text-on-secondary font-label font-bold text-base tracking-wider uppercase shadow-lg shadow-secondary/25 hover:shadow-xl hover:shadow-secondary/35 hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200 flex items-center justify-center gap-2"
          >
            <span id="primary-action-icon" class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1, 'wght' 600;">play_arrow</span>
            <span id="primary-action-label">START SESSION</span>
          </button>

          <!-- Control Bar Actions: Break, Reset, Skip -->
          <div id="timer-controls" class="flex items-center gap-3">
            <button
              id="btn-control-break"
              class="px-3.5 py-2 rounded-xl text-on-surface/60 hover:text-on-surface font-label text-xs font-semibold flex items-center gap-1 transition-all"
              title="Take a break"
            >
              <span class="material-symbols-outlined text-base">coffee</span>
              Break
            </button>
            <button
              id="btn-reset"
              class="px-3.5 py-2 rounded-xl text-on-surface/60 hover:text-on-surface font-label text-xs font-semibold flex items-center gap-1 transition-all"
              title="Reset"
            >
              <span class="material-symbols-outlined text-base">restart_alt</span>
              Reset
            </button>
            <button
              id="btn-skip"
              class="px-3.5 py-2 rounded-xl text-on-surface/60 hover:text-on-surface font-label text-xs font-semibold flex items-center gap-1 transition-all"
              title="Skip"
            >
              <span>Skip</span>
              <span class="material-symbols-outlined text-base">skip_next</span>
            </button>
            <!-- Hidden fallback button for start/pause -->
            <button id="btn-start-pause" class="hidden"></button>
          </div>
        </section>

        <div id="site-footer"></div>
      </main>
    </div>
    </div>

    <!-- MobileNav container (injected by JS) -->
    <div id="mobile-nav"></div>

    <div id="break-overlay-container"></div>
    <script type="module" src="/src/scripts/timer.ts"></script>
  </body>
</html>
