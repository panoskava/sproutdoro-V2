<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#647843"/>
      <stop offset="100%" stop-color="#3d4c24"/>
    </linearGradient>
    <linearGradient id="sprout-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b4d872"/>
      <stop offset="100%" stop-color="#7da832"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e2610" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="128" fill="url(#bg-grad)"/>

  <!-- Subtle Inner Ring -->
  <rect x="48" y="48" width="416" height="416" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4"/>

  <!-- Sprout Graphic -->
  <g filter="url(#shadow)">
    <!-- Soil base / Pot curve -->
    <path d="M 176 384 C 230 400, 282 400, 336 384 C 320 416, 192 416, 176 384 Z" fill="#36291b" opacity="0.6"/>

    <!-- Main Stem -->
    <path d="M 256 384 C 256 280, 240 210, 192 144 C 256 160, 268 250, 256 384 Z" fill="url(#sprout-grad)"/>

    <!-- Left Leaf -->
    <path d="M 236 240 C 140 220, 112 128, 192 144 C 210 180, 226 215, 236 240 Z" fill="url(#sprout-grad)"/>

    <!-- Right Leaf -->
    <path d="M 250 210 C 340 160, 384 210, 320 270 C 280 270, 260 235, 250 210 Z" fill="#a1cb5b"/>

    <!-- Center Sprout Bud -->
    <circle cx="256" cy="144" r="16" fill="#d9f099"/>
  </g>
</svg>