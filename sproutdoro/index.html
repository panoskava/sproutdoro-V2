<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#516233" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sproutdoro" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <title>Sproutdoro - Focus Timer</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body class="bg-background min-h-screen overflow-x-hidden">
    <!-- Decorative background elements -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
      <div
        class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-primary/5 blur-[100px]"
      ></div>
      <div
        class="absolute top-[20%] right-[-15%] w-[40vw] h-[40vw] rounded-full bg-secondary/5 blur-[100px]"
      ></div>
      <div
        class="absolute bottom-[-10%] left-[20%] w-[60vw] h-[60vw] rounded-full bg-tertiary/5 blur-[100px]"
      ></div>
    </div>

    <div class="relative z-10 flex min-h-screen">
      <!-- SideNav container (injected by JS) -->
      <div id="side-nav"></div>

      <!-- Main content -->
      <main
        class="flex-1 flex flex-col px-4 py-6 md:px-8 md:py-8 pb-28 md:pb-8 min-h-screen"
      >
        <!-- Header -->
        <header
          class="flex flex-col md:flex-row md:items-center md:justify-between gap-2 mb-6 md:mb-10"
        >
          <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-primary">wb_sunny</span>
            <span
              class="font-label text-sm font-semibold text-on-surface/70"
            >
              Current Season: Spring Morning
            </span>
          </div>
          <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-secondary">target</span>
            <span
              id="session-goal"
              class="font-label text-sm font-semibold text-on-surface/70"
            >
              Session Goal: Deep Focus (25m)
            </span>
          </div>
        </header>

        <!-- Category selector -->
        <div id="category-selector" class="mb-4 md:mb-6">
          <div class="flex items-center gap-2 mb-2">
            <span class="material-symbols-outlined text-primary text-sm" style="font-variation-settings: 'FILL' 1, 'wght' 600;">label</span>
            <span class="font-label text-xs font-semibold text-on-surface/50 uppercase tracking-wider">Focus Category</span>
          </div>
          <div id="category-pill-row" class="flex items-center gap-2 overflow-x-auto pb-2"></div>
        </div>

        <!-- Center stage -->
        <section class="flex-1 flex flex-col items-center justify-center gap-6 md:gap-8">
          <!-- Circular timer -->
          <div class="relative">
            <!-- Outer glass ring -->
            <div class="timer-glass rounded-full p-2 md:p-3">
              <div
                class="relative w-[320px] h-[320px] md:w-[480px] md:h-[480px]"
              >
                <!-- SVG progress ring with sun dot -->
                <div id="timer-ring" class="absolute inset-0"></div>
                <!-- Center: sprout icon/image with radial mask -->
                <div
                  class="absolute inset-0 flex items-center justify-center pointer-events-none"
                >
                  <img
                    src="/src/assets/hero.png"
                    alt="Sprout"
                    class="w-28 h-28 md:w-44 md:h-44 object-contain image-mask animate-bounce-subtle"
                  />
                </div>
                <!-- Time display: MM:SS with glass pill background -->
                <div
                  class="absolute bottom-10 md:bottom-16 left-1/2 -translate-x-1/2 timer-glass rounded-full px-6 py-2 md:px-8 md:py-3 flex items-center gap-1"
                >
                  <span
                    id="time-mins"
                    class="font-headline text-3xl md:text-5xl font-bold text-on-surface"
                  >
                    25
                  </span>
                  <span
                    class="font-headline text-3xl md:text-5xl font-bold text-primary/70"
                  >
                    :
                  </span>
                  <span
                    id="time-secs"
                    class="font-headline text-3xl md:text-5xl font-bold text-on-surface"
                  >
                    00
                  </span>
                </div>
              </div>
            </div>
          </div>

          <!-- Controls -->
          <div class="flex items-center gap-4 md:gap-6">
            <!-- Reset -->
            <button
              id="btn-reset"
              class="w-12 h-12 md:w-14 md:h-14 rounded-full glass-sage flex items-center justify-center text-on-surface/60 hover:text-on-surface hover:bg-surface-container-high/50 transition-all duration-200"
              title="Reset"
            >
              <span
                class="material-symbols-outlined text-xl md:text-2xl"
                style="font-variation-settings: 'FILL' 0, 'wght' 400;"
              >
                restart_alt
              </span>
            </button>

            <!-- Pause/Play (primary gradient) -->
            <button
              id="btn-start-pause"
              class="w-16 h-16 md:w-20 md:h-20 rounded-full bg-gradient-to-br from-primary to-primary-container text-on-primary shadow-lg shadow-primary/20 hover:shadow-xl hover:shadow-primary/30 hover:-translate-y-0.5 transition-all duration-200 flex items-center justify-center"
              title="Start"
            >
              <span
                class="material-symbols-outlined text-2xl md:text-3xl"
                style="font-variation-settings: 'FILL' 1, 'wght' 600;"
              >
                play_arrow
              </span>
            </button>

            <!-- Skip -->
            <button
              id="btn-skip"
              class="w-12 h-12 md:w-14 md:h-14 rounded-full glass-sage flex items-center justify-center text-on-surface/60 hover:text-on-surface hover:bg-surface-container-high/50 transition-all duration-200"
              title="Skip"
            >
              <span
                class="material-symbols-outlined text-xl md:text-2xl"
                style="font-variation-settings: 'FILL' 0, 'wght' 400;"
              >
                skip_next
              </span>
            </button>
          </div>
          <!-- Timer adjust buttons (visible during active session) -->
          <div id="timer-adjust-container" class="flex items-center justify-center mt-2 transition-opacity duration-300 opacity-0 pointer-events-none">
          </div>
        </section>

        <!-- Stats row -->
        <section
          id="stats-row"
          class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4 mt-6 md:mt-10"
        ></section>
      </main>
    </div>

    <!-- MobileNav container (injected by JS) -->
    <div id="mobile-nav"></div>

    <script type="module" src="/src/scripts/timer.ts"></script>
  </body>
</html>
