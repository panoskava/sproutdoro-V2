<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#516233" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sproutdoro" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <title>Sproutdoro - My Garden</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body class="bg-background min-h-screen overflow-x-hidden">
    <!-- Decorative background elements -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
      <div
        class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-primary/5 blur-[100px]"
      ></div>
      <div
        class="absolute top-[20%] right-[-15%] w-[40vw] h-[40vw] rounded-full bg-secondary/5 blur-[100px]"
      ></div>
      <div
        class="absolute bottom-[-10%] left-[20%] w-[60vw] h-[60vw] rounded-full bg-tertiary/5 blur-[100px]"
      ></div>
    </div>

    <div class="relative z-10 flex min-h-screen">
      <!-- SideNav container (injected by JS) -->
      <div id="side-nav"></div>

      <!-- Main content -->
      <main
        class="flex-1 flex flex-col px-4 py-6 md:px-8 md:py-8 pb-28 md:pb-8 min-h-screen"
      >
        <!-- Header -->
        <header class="flex flex-col gap-2 mb-6 md:mb-10">
          <div class="flex items-center gap-2">
            <span
              class="inline-flex px-3 py-1 rounded-full text-xs font-label font-semibold bg-primary/10 text-primary"
            >
              Trophy Room
            </span>
          </div>
          <h1
            class="font-headline text-2xl md:text-3xl font-bold text-on-surface"
          >
            My Garden
          </h1>
          <p class="font-body text-sm text-on-surface/60 max-w-md">
            Your personal botanical collection. Every focused minute helps your
            plants grow.
          </p>
        </header>

        <!-- Stats -->
        <section
          id="garden-stats"
          class="grid grid-cols-2 gap-3 md:gap-4 mb-6 md:mb-10"
        ></section>

        <!-- Featured Plant -->
        <section id="featured-plant-section" class="mb-6 md:mb-10">
          <div class="flex items-center gap-3 mb-4">
            <h2 class="font-headline text-lg font-bold text-on-surface">
              Featured Plant
            </h2>
            <span
              class="inline-flex px-3 py-1 rounded-full text-xs font-label font-semibold bg-secondary-fixed/30 text-on-secondary-fixed-variant"
            >
              Masterpiece
            </span>
          </div>
          <div id="featured-plant"></div>
        </section>

        <!-- Active Growth -->
        <section id="active-growth-section" class="mb-6 md:mb-10" style="display:none;">
          <div class="flex items-center gap-3 mb-4">
            <h2 class="font-headline text-lg font-bold text-on-surface">
              Currently Growing
            </h2>
            <span
              class="inline-flex px-3 py-1 rounded-full text-xs font-label font-semibold bg-primary/10 text-primary"
            >
              Active
            </span>
          </div>
          <div id="active-growth-grid" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
        </section>

        <!-- Plant Collection -->
        <section class="flex-1">
          <h2 class="font-headline text-lg font-bold text-on-surface mb-4">
            Collection
          </h2>
          <div
            id="plant-grid"
            class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"
          ></div>
        </section>
      </main>
    </div>

    <!-- Floating Action Button (desktop) -->
    <button
      id="fab-new-sprout"
      class="hidden md:flex fixed bottom-8 right-8 items-center gap-2 px-6 py-4 rounded-2xl bg-gradient-to-br from-primary to-primary-container text-on-primary font-label font-semibold text-sm shadow-lg shadow-primary/20 hover:shadow-xl hover:shadow-primary/30 hover:-translate-y-0.5 transition-all duration-200 z-50"
    >
      <span
        class="material-symbols-outlined text-lg"
        style="font-variation-settings: 'FILL' 1, 'wght' 600;"
      >
        add
      </span>
      New Sprout
    </button>

    <!-- MobileNav container (injected by JS) -->
    <div id="mobile-nav"></div>

    <!-- Planting plan modal container -->
    <div id="planting-plan-modal-container"></div>

    <script type="module" src="/src/scripts/garden.ts"></script>
  </body>
</html>
